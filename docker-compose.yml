# redis = redis server
# web = Dash web app
# worker = redis worker runs Nextflow
# demuxnet = a private network so the three can talk to each other

services:
  redis:
    image: redis:7-alpine
    container_name: demux_redis
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [demuxnet]

  web:
    build: .
    container_name: demux_web
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    command: ["python", "-u", "index.py"]
    environment:
      HOST: "0.0.0.0"
      PORT: "${WEB_PORT:-8050}"
      DEBUG: "${DEBUG:-0}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      BASE_DIR: "/home/azureuser/APPLICATION/200611_A00789R_0071_BHHVCCDRXX/"
    ports:
      - "${WEB_PORT:-8050}:${WEB_PORT:-8050}"
    volumes:
      - .:/workspace                              # code + pipeline_samplesheet.csv + NFC_DMX.config
      - /home/azureuser/APPLICATION:/home/azureuser/APPLICATION  # lane CSVs
      - /home/azureuser/.bfabricpy.yml:/home/azureuser/.bfabricpy.yml:ro  # B-Fabric config (likely needed)
    working_dir: /workspace
    networks: [demuxnet]

  # The worker runs as root and mounts the Docker socket.
  # This combination grants full control over the host’s Docker daemon (root-equivalent access).
  worker:
    build: .
    container_name: demux_worker
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    command: ["python", "-u", "scripts/worker.py", "--queues=light,heavy"]
    environment:
      NEXTFLOW_BIN: "/home/azureuser/.local/bin/nextflow"
      # Put caches under STORAGE (already bind-mounted & writable)
      NXF_HOME: "/home/azureuser/STORAGE/.nextflow"
      NXF_MAMBA_CLI: "micromamba"
      NXF_CONDA_CACHEDIR: "/home/azureuser/STORAGE/.conda"

      REDIS_HOST: "redis"
      REDIS_PORT: "6379"

      BASE_DIR: "/home/azureuser/APPLICATION/200611_A00789R_0071_BHHVCCDRXX/"
      OUTPUT_DIR: "/home/azureuser/STORAGE/OUTPUT_TEST"

    volumes:
      - .:/workspace
      - /home/azureuser/APPLICATION:/home/azureuser/APPLICATION
      - /home/azureuser/STORAGE:/home/azureuser/STORAGE
      - /home/azureuser/.bfabricpy.yml:/home/azureuser/.bfabricpy.yml:ro
      - /home/azureuser/.ssh:/home/azureuser/.ssh:ro

    working_dir: /workspace
    networks: [demuxnet]


networks:
  demuxnet:
    driver: bridge
